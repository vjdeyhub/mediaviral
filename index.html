  <!-- MONETAG VERIFICATION -->

  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      padding: 18px 15px;
      border-bottom: 1px solid #222;
    }

    .logo {
      max-width: 1200px;
      margin: auto;
      color: #e50914;
      font-size: 24px;
      font-weight: bold;
    }

    .sub {
      max-width: 1200px;
      margin: 5px auto 0;
      color: #999;
      font-size: 13px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #151515;
      border: 1px solid #242424;
      border-radius: 10px;
      overflow: hidden;
    }

    .video {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .info {
      padding: 10px;
    }

    .info h2 {
      font-size: 14px;
      line-height: 1.4;
    }

    .watch {
      display: inline-block;
      margin-top: 9px;
      padding: 8px 12px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 25px;
      border-top: 1px solid #222;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
